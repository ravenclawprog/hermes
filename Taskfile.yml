version: '3'

dotenv: ['.env', '.env.example']

tasks:
  serve:
    desc: run local hermes-ds
    dir: apps/hermes-ds
    cmds:
      - go run .

  smoke:
    desc: check auth, enter CLI
    dir: apps/hermes-cli
    cmds:
      - |
        export HERMES_SERVER_URL="http://127.0.0.1:${HERMES_DS_PORT:-8080}"
        config_dir="$(mktemp -d)" || exit 1
        trap 'rm -rf -- "$config_dir"' EXIT
        export XDG_CONFIG_HOME="$config_dir"

        go run . auth demo &&
          go run . doc list &&
          go run . doc read example
